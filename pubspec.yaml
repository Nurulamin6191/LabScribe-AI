name: labscribe
description: "Cross-platform AI companion for scientific meetings, lab discussions, and research lectures"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Presentation
  cupertino_icons: ^1.0.6
  flutter_markdown: ^0.6.18+2
  uuid: ^4.3.3

  # Audio Recording & Playback
  record: ^5.1.2
  audioplayers: ^5.2.1
  path_provider: ^2.1.2

  # Networking & APIs
  dio: ^5.4.1

  # Local Persistence
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2
  path: ^1.8.3

  # Utilities & Media
  share_plus: ^7.2.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
