name: LabScribe Multiplatform CI/CD & Automated Releases

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Android Platform Files
        run: |
          mkdir -p /tmp/android_custom
          cp -r android/app/src/main/kotlin /tmp/android_custom/ 2>/dev/null || true
          rm -rf android
          flutter create --platforms=android --org dev.labscribe --project-name labscribe .
          mkdir -p android/app/src/main/kotlin/dev/labscribe/app
          cp -r /tmp/android_custom/kotlin/* android/app/src/main/kotlin/ 2>/dev/null || true
          python3 scripts/configure_android.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Universal & Optimized APKs
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/LabScribe-AI-Universal.apk
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/LabScribe-AI-Universal.apk
            build/app/outputs/flutter-apk/*-release.apk

  build-linux:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev dpkg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Linux Platform Files
        run: |
          rm -rf linux
          flutter create --platforms=linux --org dev.labscribe --project-name labscribe .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debian Package
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: "*.deb"

  build-windows:
    name: Build Windows Portable App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Windows Platform Files
        run: |
          Remove-Item -Recurse -Force windows
          flutter create --platforms=windows --org dev.labscribe --project-name labscribe .
        shell: pwsh

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Archive Windows Release Bundle
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath LabScribe-AI-Windows-x64.zip
          } elseif (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path build\windows\runner\Release\* -DestinationPath LabScribe-AI-Windows-x64.zip
          } else {
            Write-Error "Release build directory not found!"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: LabScribe-AI-Windows-x64.zip

  publish-github-release:
    name: Publish to GitHub Releases (.apk, .deb, .zip)
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist/linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LabScribe AI ${{ github.ref_name }} — Standalone Installers"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/android/LabScribe-AI-Universal.apk
            dist/android/*-release.apk
            dist/linux/*.deb
            dist/windows/LabScribe-AI-Windows-x64.zip
